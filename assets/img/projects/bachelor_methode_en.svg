<text x="392" y="80" font-size="21" font-weight="700" fill="#1d2230">Background</text>
<text x="358" y="118" font-size="17" fill="#4a5163">Why cancer cells depend so</text>
<text x="358" y="142" font-size="17" fill="#4a5163">heavily on glutamine</text>
<rect x="648" y="40" width="276" height="214" rx="16" fill="#faf9f6" stroke="#e4e1d8" stroke-width="1.5"/>
