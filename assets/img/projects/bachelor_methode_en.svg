<circle cx="54" cy="346" r="15" fill="none" stroke="#6f7686" stroke-width="2"/>
<text x="54" y="351.5" font-size="15" font-weight="700" fill="#6f7686" text-anchor="middle">4</text>
<text x="80" y="352" font-size="21" font-weight="700" fill="#1d2230">Resistance</text>
<text x="46" y="390" font-size="17" fill="#4a5163">Detours cancer cells take</text>
<text x="46" y="414" font-size="17" fill="#4a5163">when glutamine is blocked</text>
