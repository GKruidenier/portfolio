<text x="80" y="80" font-size="21" font-weight="700" fill="#1d2230">Question</text>
<text x="46" y="118" font-size="17" fill="#4a5163">How do you break cancer</text>
<text x="46" y="142" font-size="17" fill="#4a5163">cells' resistance to</text>
<text x="46" y="166" font-size="17" fill="#4a5163">glutamine inhibitors?</text>
