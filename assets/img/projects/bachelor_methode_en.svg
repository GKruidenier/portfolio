<text x="366" y="351.5" font-size="15" font-weight="700" fill="#2a6fd6" text-anchor="middle">5</text>
<text x="392" y="352" font-size="21" font-weight="700" fill="#1d2230">Combinations</text>
<text x="358" y="390" font-size="17" fill="#4a5163">Combination therapies from</text>
<text x="358" y="414" font-size="17" fill="#4a5163">preclinical and clinical</text>
