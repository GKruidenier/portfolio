<text x="704" y="80" font-size="21" font-weight="700" fill="#1d2230">Inhibitors</text>
<text x="670" y="118" font-size="17" fill="#4a5163">Existing inhibitors and</text>
<text x="670" y="142" font-size="17" fill="#4a5163">their effect on the immune</text>
<text x="670" y="166" font-size="17" fill="#4a5163">system</text>
