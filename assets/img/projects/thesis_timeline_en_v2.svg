<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Timeline January to June. Monthly figures arrive every month. At the end of March GDP for the first quarter is still unknown, so the model makes a nowcast; the first official estimate follows about a month later." font-family="'Public Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b525c"/></marker><marker id="a-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1a"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0a8"/></marker></defs>
<rect x="40" y="58" width="324" height="178" fill="#f4f5f7"/>
<text x="52" y="80" font-size="14" fill="#222222" font-weight="600" text-anchor="start">1st quarter (Q1)</text>
<text x="376" y="80" font-size="14" fill="#5f6670" font-weight="600" text-anchor="start">2nd quarter</text>
<line x1="40" y1="236" x2="688" y2="236" stroke="#9aa0a8" stroke-width="1.5"/>
<line x1="40" y1="236" x2="40" y2="242" stroke="#9aa0a8"/>
<text x="94.0" y="260" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">Jan</text>
<line x1="148" y1="236" x2="148" y2="242" stroke="#9aa0a8"/>
<text x="202.0" y="260" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">Feb</text>
<line x1="256" y1="236" x2="256" y2="242" stroke="#9aa0a8"/>
<text x="310.0" y="260" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">Mar</text>
<line x1="364" y1="236" x2="364" y2="242" stroke="#9aa0a8"/>
<text x="418.0" y="260" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">Apr</text>
<line x1="472" y1="236" x2="472" y2="242" stroke="#9aa0a8"/>
<text x="526.0" y="260" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">May</text>
<line x1="580" y1="236" x2="580" y2="242" stroke="#9aa0a8"/>
<text x="634.0" y="260" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">Jun</text>
<rect x="133" y="202" width="14" height="28" rx="3" fill="#1f77b4"/>
<rect x="241" y="202" width="14" height="28" rx="3" fill="#1f77b4"/>
<rect x="349" y="202" width="14" height="28" rx="3" fill="#1f77b4"/>
<rect x="457" y="202" width="14" height="28" rx="3" fill="#1f77b4"/>
<rect x="565" y="202" width="14" height="28" rx="3" fill="#1f77b4"/>
<text x="52" y="188" font-size="14" fill="#175a89" font-weight="600" text-anchor="start">monthly figures</text>
<text x="52" y="204" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">every month</text>
<line x1="334" y1="96" x2="334" y2="236" stroke="#222222" stroke-width="1.6" stroke-dasharray="3 4"/>
<text x="324" y="112" font-size="14" fill="#222222" font-weight="700" text-anchor="end">now</text>
<circle cx="334" cy="140" r="8" fill="#222222"/>
<text x="318" y="136" font-size="13" fill="#222222" font-weight="700" text-anchor="end">nowcast:</text>
<text x="318" y="152" font-size="13" fill="#4b525c" font-weight="400" text-anchor="end">estimate of Q1 GDP</text>
<path d="M468,126 l11,11 l-11,11 l-11,-11 z" fill="#e07b1a"/>
<text x="486" y="132" font-size="14" fill="#a8560a" font-weight="700" text-anchor="start">Q1 GDP published</text>
<text x="486" y="149" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">first estimate</text>
<line x1="366" y1="176" x2="464" y2="176" stroke="#e07b1a" stroke-width="2" marker-end="url(#a-org)"/>
<text x="416.0" y="196" font-size="13" fill="#a8560a" font-weight="600" text-anchor="middle">about a month later</text>
<text x="40" y="32" font-size="13" fill="#4b525c" font-weight="400" text-anchor="start">GDP for a quarter is published only after the quarter ends; a nowcast estimates it before that.</text>
</svg>
