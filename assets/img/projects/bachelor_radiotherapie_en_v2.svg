<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Both cells get the same radiation, which creates reactive oxygen species (ROS). Left: glutamine supplies glutathione (GSH), which neutralises the ROS and the cell copes. Right: CB-839 blocks glutamine, there is no GSH, and the ROS build up and cause more damage." font-family="'Public Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b525c"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker><marker id="a-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker><marker id="a-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c7cd"/></marker><polygon id="ros" points="0.00,-10.00 1.72,-4.16 7.07,-7.07 4.16,-1.72 10.00,0.00 4.16,1.72 7.07,7.07 1.72,4.16 0.00,10.00 -1.72,4.16 -7.07,7.07 -4.16,1.72 -10.00,0.00 -4.16,-1.72 -7.07,-7.07 -1.72,-4.16"/></defs>
<text x="6" y="26" font-size="16" fill="#222222" font-weight="700" text-anchor="start">Radiation alone</text><text x="6" y="46" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">glutamine keeps the shield up</text><rect x="76" y="84" width="260" height="196" rx="22" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2"/><text x="92" y="106" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">cancer cell</text><text x="6" y="131" font-size="13" fill="#175a89" font-weight="600" text-anchor="start">glutamine</text><line x1="6" y1="150" x2="118" y2="150" stroke="#1f77b4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="122" y="132" width="72" height="36" rx="18.0" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/><text x="158.0" y="155.0" font-size="15" fill="#222222" font-weight="600" text-anchor="middle">GSH</text><text x="158" y="186" font-size="13" fill="#5f6670" font-weight="400" text-anchor="middle">glutathione</text><path d="M256,52 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10" fill="none" stroke="#d62728" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-red)"/><path d="M272,52 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10" fill="none" stroke="#d62728" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-red)"/><path d="M288,52 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10" fill="none" stroke="#d62728" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-red)"/><text x="246" y="70" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="end">radiation</text><line x1="196" y1="150" x2="236" y2="150" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/><text x="222" y="128" font-size="12" fill="#5f6670" font-weight="400" text-anchor="middle">neutralises</text><use href="#ros" x="252" y="150" fill="#ffffff" stroke="#c3c7cd" stroke-width="1.5"/><use href="#ros" x="296" y="168" fill="#ffffff" stroke="#c3c7cd" stroke-width="1.5"/><use href="#ros" x="266" y="206" fill="#ffffff" stroke="#c3c7cd" stroke-width="1.5"/><text x="206" y="312" font-size="14" fill="#222222" font-weight="700" text-anchor="middle">ROS neutralised: cell copes</text><text x="324" y="266" font-size="13" fill="#5f6670" font-weight="600" text-anchor="end">ROS</text><line x1="358" y1="16" x2="358" y2="320" stroke="#dadde2"/><text x="380" y="26" font-size="16" fill="#222222" font-weight="700" text-anchor="start">CB-839 + radiation</text><text x="380" y="46" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">no glutamine, so no shield</text><rect x="450" y="84" width="260" height="196" rx="22" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2"/><text x="466" y="106" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">cancer cell</text><text x="380" y="131" font-size="13" fill="#5f6670" font-weight="600" text-anchor="start">glutamine</text><line x1="380" y1="150" x2="492" y2="150" stroke="#c3c7cd" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#a-fade)"/><line x1="410" y1="140" x2="410" y2="160" stroke="#d62728" stroke-width="5" stroke-linecap="round"/><text x="410" y="182" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="middle">CB-839</text><rect x="496" y="132" width="72" height="36" rx="18.0" fill="#ffffff" stroke="#c3c7cd" stroke-width="1.5" stroke-dasharray="4 4"/><text x="532.0" y="155.0" font-size="14" fill="#5f6670" font-weight="600" text-anchor="middle">no GSH</text><path d="M630,52 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10" fill="none" stroke="#d62728" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-red)"/><path d="M646,52 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10" fill="none" stroke="#d62728" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-red)"/><path d="M662,52 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10 q6,5 0,10 q-6,5 0,10" fill="none" stroke="#d62728" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-red)"/><text x="620" y="70" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="end">radiation</text><use href="#ros" x="626" y="150" fill="#4b525c"/><use href="#ros" x="670" y="168" fill="#4b525c"/><use href="#ros" x="640" y="206" fill="#4b525c"/><use href="#ros" x="682" y="226" fill="#4b525c"/><use href="#ros" x="602" y="238" fill="#4b525c"/><text x="580" y="312" font-size="14" fill="#222222" font-weight="700" text-anchor="middle">ROS build up: more damage</text><text x="698" y="266" font-size="13" fill="#5f6670" font-weight="600" text-anchor="end">ROS</text>
</svg>
