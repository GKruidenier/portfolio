<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Glutamine enters the cancer cell through SLC1A5 and is turned into glutamate by glutaminase (GLS), the step CB-839 blocks. Glutamate feeds the TCA cycle for energy, the antioxidant glutathione and the mTORC1 growth signal; glutamine also supplies nucleotides directly." font-family="'Public Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b525c"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker><marker id="a-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker><marker id="a-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c7cd"/></marker><polygon id="ros" points="0.00,-10.00 1.72,-4.16 7.07,-7.07 4.16,-1.72 10.00,0.00 4.16,1.72 7.07,7.07 1.72,4.16 0.00,10.00 -1.72,4.16 -7.07,7.07 -4.16,1.72 -10.00,0.00 -4.16,-1.72 -7.07,-7.07 -1.72,-4.16"/></defs>
<text x="16" y="70" font-size="15" fill="#175a89" font-weight="600" text-anchor="start">glutamine</text><text x="16" y="88" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">from the blood</text><circle cx="28" cy="114" r="8" fill="#1f77b4"/><circle cx="52" cy="104" r="8" fill="#1f77b4"/><circle cx="44" cy="130" r="8" fill="#1f77b4"/><line x1="66" y1="112" x2="108" y2="112" stroke="#1f77b4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="113" y="94" width="14" height="36" rx="4" fill="#1f77b4"/><text x="104" y="154" font-size="13" fill="#5f6670" font-weight="400" text-anchor="end">SLC1A5</text><text x="104" y="171" font-size="13" fill="#5f6670" font-weight="400" text-anchor="end">transporter</text>
<rect x="120" y="20" width="590" height="340" rx="24" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2"/><text x="140" y="48" font-size="14" fill="#5f6670" font-weight="400" text-anchor="start">cancer cell</text>
<rect x="146" y="94" width="104" height="36" rx="18.0" fill="#eef4fa" stroke="#1f77b4" stroke-width="1.5"/><text x="198.0" y="117.0" font-size="15" fill="#175a89" font-weight="600" text-anchor="middle">glutamine</text><text x="303" y="86" font-size="13" fill="#4b525c" font-weight="400" text-anchor="middle">glutaminase (GLS)</text><line x1="252" y1="112" x2="354" y2="112" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/><rect x="360" y="94" width="104" height="36" rx="18.0" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/><text x="412.0" y="117.0" font-size="15" fill="#222222" font-weight="600" text-anchor="middle">glutamate</text><line x1="466" y1="112" x2="506" y2="112" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/><rect x="510" y="94" width="64" height="36" rx="18.0" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/><text x="542.0" y="117.0" font-size="15" fill="#222222" font-weight="600" text-anchor="middle">α-KG</text><line x1="576" y1="112" x2="604" y2="112" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/><circle cx="648" cy="112" r="40" fill="#ffffff" stroke="#9aa0a8" stroke-width="2"/><text x="648" y="108" font-size="14" fill="#222222" font-weight="600" text-anchor="middle">TCA</text><text x="648" y="125" font-size="14" fill="#222222" font-weight="600" text-anchor="middle">cycle</text>
<text x="648" y="172" font-size="13" fill="#4b525c" font-weight="600" text-anchor="middle">energy</text>
<text x="303" y="146" font-size="13" fill="#b71c1c" font-weight="600" text-anchor="middle">blocked by CB-839</text>
<line x1="198" y1="132" x2="198" y2="244" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/>
<text x="206" y="196" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">used directly</text>
<line x1="412" y1="132" x2="412" y2="244" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/>
<path d="M542,132 Q546,190 600,244" fill="none" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/>
<g><rect x="146" y="250" width="160" height="90" rx="6" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/><text x="160" y="276" font-size="15" fill="#222222" font-weight="600" text-anchor="start">Building blocks</text><text x="160" y="298" font-size="13" fill="#4b525c" font-weight="400" text-anchor="start">nucleotides for</text><text x="160" y="316" font-size="13" fill="#4b525c" font-weight="400" text-anchor="start">new DNA</text></g>
<g><rect x="346" y="250" width="160" height="90" rx="6" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/><text x="360" y="276" font-size="15" fill="#222222" font-weight="600" text-anchor="start">Antioxidant</text><text x="360" y="298" font-size="13" fill="#4b525c" font-weight="400" text-anchor="start">glutathione (GSH)</text><text x="360" y="316" font-size="13" fill="#4b525c" font-weight="400" text-anchor="start">neutralises ROS</text></g>
<g><rect x="546" y="250" width="160" height="90" rx="6" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/><text x="560" y="276" font-size="15" fill="#222222" font-weight="600" text-anchor="start">Growth signal</text><text x="560" y="298" font-size="13" fill="#4b525c" font-weight="400" text-anchor="start">activates mTORC1,</text><text x="560" y="316" font-size="13" fill="#4b525c" font-weight="400" text-anchor="start">the growth switch</text></g>
</svg>
