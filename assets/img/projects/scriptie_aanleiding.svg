<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="440" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7686"/></marker></defs>
<rect x="10" y="20" width="296" height="200" rx="14" fill="#faf9f6" stroke="#e4e1d8" stroke-width="1.5"/>
<text x="32" y="54" font-size="12.5" fill="#6f7686" font-weight="700" text-anchor="start" letter-spacing="1.2">STANDAARD</text>
<text x="32" y="84" font-size="19" fill="#1d2230" font-weight="700" text-anchor="start" >Klassieke modellen</text>
<text x="32" y="106" font-size="13.5" fill="#6f7686" font-weight="600" text-anchor="start" >Dynamic Factor Model</text>
<text x="32" y="138.0" font-size="15" fill="#4a5163" font-weight="500" text-anchor="start" >Bij bijna elke centrale bank</text>
<text x="32" y="158.25" font-size="15" fill="#4a5163" font-weight="500" text-anchor="start" >in gebruik</text>
<text x="32" y="186.0" font-size="14" fill="#c9783d" font-weight="700" text-anchor="start" >Ziet alleen rechtlijnige</text>
<text x="32" y="204.9" font-size="14" fill="#c9783d" font-weight="700" text-anchor="start" >verbanden</text>
<line x1="314" y1="120.0" x2="344" y2="120.0" stroke="#6f7686" stroke-width="2" marker-end="url(#a)"/>
<rect x="352" y="20" width="296" height="200" rx="14" fill="#faf9f6" stroke="#e4e1d8" stroke-width="1.5"/>
<text x="374" y="54" font-size="12.5" fill="#6f7686" font-weight="700" text-anchor="start" letter-spacing="1.2">OPKOMEND</text>
<text x="374" y="84" font-size="19" fill="#1d2230" font-weight="700" text-anchor="start" >Machine learning</text>
<text x="374" y="106" font-size="13.5" fill="#6f7686" font-weight="600" text-anchor="start" >bijvoorbeeld Random Forest</text>
<text x="374" y="138.0" font-size="15" fill="#4a5163" font-weight="500" text-anchor="start" >Eerste studies, met</text>
<text x="374" y="158.25" font-size="15" fill="#4a5163" font-weight="500" text-anchor="start" >veelbelovende resultaten</text>
<text x="374" y="186.0" font-size="14" fill="#c9783d" font-weight="700" text-anchor="start" >Maandcijfers eerst gemiddeld</text>
<text x="374" y="204.9" font-size="14" fill="#c9783d" font-weight="700" text-anchor="start" >of aangevuld: info gaat verloren</text>
<line x1="656" y1="120.0" x2="686" y2="120.0" stroke="#6f7686" stroke-width="2" marker-end="url(#a)"/>
<rect x="694" y="20" width="296" height="200" rx="14" fill="#e7effb" stroke="#2a6fd6" stroke-width="2"/>
<text x="716" y="54" font-size="12.5" fill="#1f56a8" font-weight="700" text-anchor="start" letter-spacing="1.2">DEZE SCRIPTIE</text>
<text x="716" y="84" font-size="19" fill="#1f56a8" font-weight="700" text-anchor="start" >Deep learning</text>
<text x="716" y="106" font-size="13.5" fill="#6f7686" font-weight="600" text-anchor="start" >LSTM en GRU</text>
<text x="716" y="138.0" font-size="15" fill="#4a5163" font-weight="500" text-anchor="start" >Nog weinig onderzocht</text>
<text x="716" y="158.25" font-size="15" fill="#4a5163" font-weight="500" text-anchor="start" >voor het bbp</text>
<text x="716" y="186.0" font-size="14" fill="#1f56a8" font-weight="700" text-anchor="start" >Nieuw: aangepast om maand- en</text>
<text x="716" y="204.9" font-size="14" fill="#1f56a8" font-weight="700" text-anchor="start" >kwartaalcijfers direct te lezen</text>
<rect x="10" y="262" width="480" height="168" rx="14" fill="#ffffff" stroke="#2a6fd6" stroke-width="1.5"/>
<circle cx="48" cy="304" r="18" fill="#2a6fd6"/>
<text x="48" y="311" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" >1</text>
<text x="78" y="310" font-size="13" fill="#1f56a8" font-weight="700" text-anchor="start" letter-spacing="1.2">ONDERZOEKSVRAAG</text>
<text x="34" y="354" font-size="18" fill="#1d2230" font-weight="600" text-anchor="start" >Kan deep learning het bbp nowcasten,</text>
<text x="34" y="380" font-size="18" fill="#1d2230" font-weight="600" text-anchor="start" >en hoe doet het dat ten opzichte</text>
<text x="34" y="406" font-size="18" fill="#1d2230" font-weight="600" text-anchor="start" >van de klassieke modellen?</text>
<rect x="510" y="262" width="480" height="168" rx="14" fill="#ffffff" stroke="#2a6fd6" stroke-width="1.5"/>
<circle cx="548" cy="304" r="18" fill="#2a6fd6"/>
<text x="548" y="311" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" >2</text>
<text x="578" y="310" font-size="13" fill="#1f56a8" font-weight="700" text-anchor="start" letter-spacing="1.2">ONDERZOEKSVRAAG</text>
<text x="534" y="354" font-size="18" fill="#1d2230" font-weight="600" text-anchor="start" >Wordt de schatting van het huidige</text>
<text x="534" y="380" font-size="18" fill="#1d2230" font-weight="600" text-anchor="start" >kwartaal beter als het model ook</text>
<text x="534" y="406" font-size="18" fill="#1d2230" font-weight="600" text-anchor="start" >de maandcijfers meeleest?</text>
</svg>
