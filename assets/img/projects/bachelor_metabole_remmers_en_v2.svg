<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" width="720" height="550" role="img" aria-label="Combination with metabolic inhibitors: CB-839 blocks glutaminase, metformin blocks glycolysis, etomoxir blocks fatty acid oxidation, and GTK knockdown and 2-PMPA block the other routes to glutamate, so the TCA cycle loses its fuel. Autophagy and amino-acid uptake are not targeted." font-family="'Public Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<rect width="720" height="550" fill="#ffffff"/>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b525c"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker><marker id="a-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker><marker id="a-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c7cd"/></marker><polygon id="ros" points="0.00,-10.00 1.72,-4.16 7.07,-7.07 4.16,-1.72 10.00,0.00 4.16,1.72 7.07,7.07 1.72,4.16 0.00,10.00 -1.72,4.16 -7.07,7.07 -4.16,1.72 -10.00,0.00 -4.16,-1.72 -7.07,-7.07 -1.72,-4.16"/></defs>
<g transform="translate(0,90)">
<text x="16" y="70" font-size="15" fill="#175a89" font-weight="600" text-anchor="start">glutamine</text><text x="16" y="88" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">from the blood</text><circle cx="28" cy="114" r="8" fill="#1f77b4"/><circle cx="52" cy="104" r="8" fill="#1f77b4"/><circle cx="44" cy="130" r="8" fill="#1f77b4"/><line x1="66" y1="112" x2="108" y2="112" stroke="#1f77b4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="113" y="94" width="14" height="36" rx="4" fill="#1f77b4"/><text x="104" y="154" font-size="13" fill="#5f6670" font-weight="400" text-anchor="end">SLC1A5</text><text x="104" y="171" font-size="13" fill="#5f6670" font-weight="400" text-anchor="end">transporter</text>
<rect x="120" y="20" width="590" height="420" rx="24" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2"/><text x="140" y="48" font-size="14" fill="#5f6670" font-weight="400" text-anchor="start">cancer cell</text>
<rect x="146" y="94" width="104" height="36" rx="18.0" fill="#eef4fa" stroke="#1f77b4" stroke-width="1.5"/><text x="198.0" y="117.0" font-size="15" fill="#175a89" font-weight="600" text-anchor="middle">glutamine</text><text x="303" y="86" font-size="13" fill="#4b525c" font-weight="400" text-anchor="middle">glutaminase (GLS)</text><line x1="252" y1="112" x2="354" y2="112" stroke="#c3c7cd" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#a-fade)"/><line x1="303" y1="99" x2="303" y2="125" stroke="#d62728" stroke-width="5" stroke-linecap="round"/><text x="303" y="146" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="middle">CB-839</text><rect x="360" y="94" width="104" height="36" rx="18.0" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/><text x="412.0" y="117.0" font-size="15" fill="#222222" font-weight="600" text-anchor="middle">glutamate</text><line x1="466" y1="112" x2="506" y2="112" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/><rect x="510" y="94" width="64" height="36" rx="18.0" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/><text x="542.0" y="117.0" font-size="15" fill="#222222" font-weight="600" text-anchor="middle">α-KG</text><line x1="576" y1="112" x2="604" y2="112" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/><circle cx="648" cy="112" r="40" fill="#eceef1" stroke="#c3c7cd" stroke-width="2" stroke-dasharray="5 4"/><text x="648" y="108" font-size="14" fill="#5f6670" font-weight="600" text-anchor="middle">TCA</text><text x="648" y="125" font-size="14" fill="#5f6670" font-weight="600" text-anchor="middle">cycle</text>
<text x="648" y="172" font-size="13" fill="#222222" font-weight="700" text-anchor="middle">energy fails</text>
<path d="M198,92 Q305,18 410,92" fill="none" stroke="#e07b1a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-org)"/>
<circle cx="222" cy="39" r="10" fill="#e07b1a"/><text x="222" y="43.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="238" y="44" font-size="13" fill="#a8560a" font-weight="700" text-anchor="start">glutaminase II pathway</text>
<rect x="246" y="182" width="84" height="32" rx="16.0" fill="#ffffff" stroke="#e07b1a" stroke-width="1.5"/><text x="288.0" y="203.0" font-size="14" fill="#a8560a" font-weight="700" text-anchor="middle">NAAG</text>
<line x1="330" y1="190" x2="380" y2="134" stroke="#e07b1a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-org)"/>
<line x1="362" y1="54" x2="355" y2="76" stroke="#d62728" stroke-width="5" stroke-linecap="round"/>
<text x="372" y="70" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="start">GTK knockdown</text>
<line x1="346" y1="152" x2="364" y2="168" stroke="#d62728" stroke-width="5" stroke-linecap="round"/>
<text x="370" y="182" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="start">2-PMPA</text>
<g opacity="0.4"><path d="M484,262 a18,18 0 1,1 -4,-14" fill="none" stroke="#e07b1a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-org)"/><circle cx="512" cy="250" r="10" fill="#e07b1a"/><text x="512" y="254.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="528" y="255" font-size="15" fill="#a8560a" font-weight="700" text-anchor="start">autophagy</text><text x="528" y="273" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">recycles its own parts</text><line x1="470" y1="288" x2="470" y2="334" stroke="#e07b1a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-org)"/><circle cx="26" cy="232" r="10" fill="#e07b1a"/><text x="26" y="236.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="42" y="237" font-size="15" fill="#a8560a" font-weight="700" text-anchor="start">aspartate</text><text x="16" y="256" font-size="15" fill="#a8560a" font-weight="700" text-anchor="start">and arginine</text><text x="16" y="276" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">via SLC1A3</text><text x="16" y="293" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">and SLC7A3</text><line x1="16" y1="318" x2="108" y2="318" stroke="#e07b1a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-org)"/><rect x="113" y="300" width="14" height="36" rx="4" fill="#e07b1a"/><path d="M128,318 L200,318 L200,334" fill="none" stroke="#e07b1a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-org)"/><g><rect x="146" y="340" width="560" height="70" rx="6" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/><text x="160" y="366" font-size="15" fill="#222222" font-weight="600" text-anchor="start">Building blocks and growth</text><text x="160" y="388" font-size="13" fill="#4b525c" font-weight="400" text-anchor="start">nucleotides and proteins for new cells, and the mTORC1 growth signal</text></g></g>
</g>
<circle cx="398" cy="24" r="10" fill="#e07b1a"/><text x="398" y="28.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="414" y="29" font-size="15" fill="#a8560a" font-weight="700" text-anchor="start">glucose</text>
<text x="414" y="47" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">via glycolysis</text>
<path d="M450,58 Q560,70 616,170" fill="none" stroke="#e07b1a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-org)"/>
<circle cx="620" cy="24" r="10" fill="#e07b1a"/><text x="620" y="28.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="712" y="29" font-size="15" fill="#a8560a" font-weight="700" text-anchor="end">fatty acids</text>
