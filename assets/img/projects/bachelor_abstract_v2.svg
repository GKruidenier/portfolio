<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" width="900" height="346" role="img" aria-label="Visuele samenvatting in drie stappen: een tumorcel draait op glutamine; met één remmer (CB-839) neemt hij een omweg via glucose en vetzuren; een combinatietherapie koppelt de glutamineremmer aan één partner: andere remmers, radiotherapie of immuuntherapie." font-family="'Public Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<rect width="900" height="346" fill="#ffffff"/>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b525c"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker><marker id="a-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker><marker id="a-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c7cd"/></marker><polygon id="ros" points="0.00,-10.00 1.72,-4.16 7.07,-7.07 4.16,-1.72 10.00,0.00 4.16,1.72 7.07,7.07 1.72,4.16 0.00,10.00 -1.72,4.16 -7.07,7.07 -4.16,1.72 -10.00,0.00 -4.16,-1.72 -7.07,-7.07 -1.72,-4.16"/></defs>
<text x="0" y="26" font-size="16" fill="#222222" font-weight="700" text-anchor="start">Tumor draait op glutamine</text><text x="0" y="46" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">de brandstof voor groei</text><rect x="70" y="84" width="180" height="168" rx="22" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2"/><text x="86" y="106" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">kankercel</text><circle cx="194" cy="172" r="32" fill="#ffffff" stroke="#9aa0a8" stroke-width="2"/><text x="194" y="168" font-size="13" fill="#222222" font-weight="600" text-anchor="middle">TCA-</text><text x="194" y="184" font-size="13" fill="#222222" font-weight="600" text-anchor="middle">cyclus</text><text x="0" y="162" font-size="13" fill="#175a89" font-weight="700" text-anchor="start">glutamine</text><line x1="0" y1="172" x2="158" y2="172" stroke="#1f77b4" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="160" y="284" font-size="15" fill="#222222" font-weight="700" text-anchor="middle">groei</text>
<line x1="262" y1="172" x2="296" y2="172" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/>
<text x="310" y="26" font-size="16" fill="#222222" font-weight="700" text-anchor="start">Eén remmer</text><text x="310" y="46" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">de cel neemt een omweg</text><rect x="380" y="84" width="180" height="168" rx="22" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2"/><text x="396" y="106" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">kankercel</text><circle cx="504" cy="172" r="32" fill="#ffffff" stroke="#9aa0a8" stroke-width="2"/><text x="504" y="168" font-size="13" fill="#222222" font-weight="600" text-anchor="middle">TCA-</text><text x="504" y="184" font-size="13" fill="#222222" font-weight="600" text-anchor="middle">cyclus</text><text x="310" y="162" font-size="13" fill="#5f6670" font-weight="600" text-anchor="start">glutamine</text><line x1="310" y1="172" x2="468" y2="172" stroke="#c3c7cd" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#a-fade)"/><line x1="350" y1="165" x2="350" y2="181" stroke="#d62728" stroke-width="5" stroke-linecap="round"/><text x="350" y="202" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="middle">CB-839</text><text x="310" y="116" font-size="13" fill="#a8560a" font-weight="700" text-anchor="start">glucose</text><path d="M310,126 L422,126 Q454,126 480,150" fill="none" stroke="#e07b1a" stroke-width="3" stroke-linecap="round" marker-end="url(#a-org)"/><text x="310" y="242" font-size="13" fill="#a8560a" font-weight="700" text-anchor="start">vetzuren</text><path d="M310,226 L422,226 Q454,226 480,194" fill="none" stroke="#e07b1a" stroke-width="3" stroke-linecap="round" marker-end="url(#a-org)"/>
<text x="470" y="284" font-size="15" fill="#a8560a" font-weight="700" text-anchor="middle">resistentie</text>
<line x1="572" y1="172" x2="606" y2="172" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/>
<text x="620" y="26" font-size="16" fill="#222222" font-weight="700" text-anchor="start">Combinatietherapie</text><text x="620" y="46" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">glutamineremmer plus één partner</text><rect x="690" y="84" width="180" height="168" rx="22" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2"/><text x="706" y="106" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">kankercel</text><circle cx="814" cy="172" r="32" fill="#ffffff" stroke="#9aa0a8" stroke-width="2"/><text x="814" y="168" font-size="13" fill="#222222" font-weight="600" text-anchor="middle">TCA-</text><text x="814" y="184" font-size="13" fill="#222222" font-weight="600" text-anchor="middle">cyclus</text><text x="620" y="162" font-size="13" fill="#5f6670" font-weight="600" text-anchor="start">glutamine</text><line x1="620" y1="172" x2="778" y2="172" stroke="#c3c7cd" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#a-fade)"/><line x1="660" y1="165" x2="660" y2="181" stroke="#d62728" stroke-width="5" stroke-linecap="round"/><text x="660" y="202" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="middle">CB-839</text>
<text x="690" y="284" font-size="15" fill="#b71c1c" font-weight="700" text-anchor="start">+ andere remmers</text>
<text x="690" y="308" font-size="15" fill="#b71c1c" font-weight="700" text-anchor="start">+ radiotherapie</text>
<text x="690" y="332" font-size="15" fill="#b71c1c" font-weight="700" text-anchor="start">+ immuuntherapie</text>
</svg>
