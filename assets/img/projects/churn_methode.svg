<text x="80" y="80" font-size="21" font-weight="700" fill="#1d2230">Ruwe data</text>
<text x="46" y="118" font-size="17" fill="#4a5163">153.929 gespeelde potjes:</text>
<text x="46" y="142" font-size="17" fill="#4a5163">tijdstip, score en</text>
