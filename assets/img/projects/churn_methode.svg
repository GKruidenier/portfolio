<text x="358" y="468" font-size="17" fill="#4a5163">CV</text>
<rect x="648" y="312" width="276" height="214" rx="16" fill="#1d2230" stroke="#1d2230" stroke-width="1.5"/>
<circle cx="678" cy="346" r="15" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="678" y="351.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
