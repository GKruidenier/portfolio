<text x="392" y="80" font-size="21" font-weight="700" fill="#1d2230">Churn labelen</text>
<text x="358" y="118" font-size="17" fill="#4a5163">5 dagen observeren, 12</text>
<text x="358" y="142" font-size="17" fill="#4a5163">dagen kijken of iemand</text>
<text x="358" y="166" font-size="17" fill="#4a5163">terugkomt</text>
