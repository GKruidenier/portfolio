<text x="670" y="118" font-size="17" fill="#4a5163">13 gedragskenmerken</text>
<text x="670" y="142" font-size="17" fill="#4a5163">gemaakt, 8 gehouden na</text>
<text x="670" y="166" font-size="17" fill="#4a5163">effectgrootte en</text>
<text x="670" y="190" font-size="17" fill="#4a5163">correlatie</text>
