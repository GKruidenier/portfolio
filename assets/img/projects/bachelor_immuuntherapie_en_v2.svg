<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620" role="img" aria-label="Three steps. 1: a glutamine inhibitor starves the tumour cell while the CD8+ T cell switches to acetate and glucose and gets stronger. 2: the tumour cell puts more PD-L1 on its surface, which binds PD-1 and switches the T cell off. 3: a checkpoint inhibitor (anti-PD-L1) blocks PD-L1, so the T cell attacks the tumour cell." font-family="'Public Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<rect width="680" height="620" fill="#ffffff"/>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b525c"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker><marker id="a-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker><marker id="a-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c7cd"/></marker><polygon id="ros" points="0.00,-10.00 1.72,-4.16 7.07,-7.07 4.16,-1.72 10.00,0.00 4.16,1.72 7.07,7.07 1.72,4.16 0.00,10.00 -1.72,4.16 -7.07,7.07 -4.16,1.72 -10.00,0.00 -4.16,-1.72 -7.07,-7.07 -1.72,-4.16"/></defs>
<g transform="translate(12,4)"><text x="0" y="24" font-size="16" fill="#222222" font-weight="700" text-anchor="start">1. Glutamine blocked</text>
<text x="0" y="102" font-size="13" fill="#175a89" font-weight="600" text-anchor="start">glutamine</text>
<line x1="4" y1="118" x2="74" y2="118" stroke="#c3c7cd" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#a-fade)"/>
<line x1="40" y1="109" x2="40" y2="127" stroke="#d62728" stroke-width="5" stroke-linecap="round"/>
<text x="40" y="150" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="middle">inhibitor</text>
<circle cx="130" cy="118" r="52" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2"/><text x="130" y="115" font-size="14" fill="#4b525c" font-weight="600" text-anchor="middle">tumour</text><text x="130" y="132" font-size="14" fill="#4b525c" font-weight="600" text-anchor="middle">cell</text>
<circle cx="330" cy="118" r="40" fill="#ffffff" stroke="#4b525c" stroke-width="2"/><text x="330" y="115" font-size="14" fill="#222222" font-weight="700" text-anchor="middle">CD8+</text><text x="330" y="132" font-size="14" fill="#222222" font-weight="700" text-anchor="middle">T cell</text>
<path d="M404,52 Q370,58 354,82" fill="none" stroke="#4b525c" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/>
<text x="408" y="56" font-size="13" fill="#5f6670" font-weight="400" text-anchor="start">uses acetate and glucose</text>
<text x="420" y="105" font-size="15" fill="#222222" font-weight="700" text-anchor="start">Tumour cell starves.</text><text x="420" y="125" font-size="14" fill="#4b525c" font-weight="400" text-anchor="start">The T cell switches fuel</text><text x="420" y="144" font-size="14" fill="#4b525c" font-weight="400" text-anchor="start">and gets stronger.</text>
<line x1="0" y1="204" x2="664" y2="204" stroke="#dadde2"/>
<text x="0" y="238" font-size="16" fill="#222222" font-weight="700" text-anchor="start">2. The tumour cell hits the brake</text>
<circle cx="130" cy="332" r="52" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2"/><text x="130" y="329" font-size="14" fill="#4b525c" font-weight="600" text-anchor="middle">tumour</text><text x="130" y="346" font-size="14" fill="#4b525c" font-weight="600" text-anchor="middle">cell</text>
<line x1="175.1" y1="310" x2="208" y2="310" stroke="#e07b1a" stroke-width="3" stroke-linecap="round"/><circle cx="213" cy="310" r="6" fill="#e07b1a"/><line x1="298.6" y1="310" x2="230" y2="310" stroke="#4b525c" stroke-width="3" stroke-linecap="round"/><rect x="224" y="302" width="6" height="16" rx="2" fill="#4b525c"/><line x1="180.0" y1="332" x2="208" y2="332" stroke="#e07b1a" stroke-width="3" stroke-linecap="round"/><circle cx="213" cy="332" r="6" fill="#e07b1a"/><line x1="292.0" y1="332" x2="230" y2="332" stroke="#4b525c" stroke-width="3" stroke-linecap="round"/><rect x="224" y="324" width="6" height="16" rx="2" fill="#4b525c"/><line x1="175.1" y1="354" x2="208" y2="354" stroke="#e07b1a" stroke-width="3" stroke-linecap="round"/><circle cx="213" cy="354" r="6" fill="#e07b1a"/><line x1="298.6" y1="354" x2="230" y2="354" stroke="#4b525c" stroke-width="3" stroke-linecap="round"/><rect x="224" y="346" width="6" height="16" rx="2" fill="#4b525c"/><text x="200" y="390" font-size="13" fill="#a8560a" font-weight="700" text-anchor="middle">PD-L1</text><text x="262" y="390" font-size="13" fill="#4b525c" font-weight="700" text-anchor="middle">PD-1</text>
<circle cx="330" cy="332" r="40" fill="#eceef1" stroke="#c3c7cd" stroke-width="2"/><text x="330" y="329" font-size="14" fill="#5f6670" font-weight="700" text-anchor="middle">CD8+</text><text x="330" y="346" font-size="14" fill="#5f6670" font-weight="700" text-anchor="middle">T cell</text>
<text x="420" y="328" font-size="15" fill="#222222" font-weight="700" text-anchor="start">More PD-L1 binds PD-1:</text><text x="420" y="348" font-size="14" fill="#4b525c" font-weight="400" text-anchor="start">the T cell is switched off.</text>
<line x1="0" y1="418" x2="664" y2="418" stroke="#dadde2"/>
<text x="0" y="452" font-size="16" fill="#222222" font-weight="700" text-anchor="start">3. Checkpoint inhibitor added</text>
<circle cx="130" cy="546" r="52" fill="#f4f5f7" stroke="#9aa0a8" stroke-width="2" stroke-dasharray="6 5"/><text x="130" y="543" font-size="14" fill="#4b525c" font-weight="600" text-anchor="middle">tumour</text><text x="130" y="560" font-size="14" fill="#4b525c" font-weight="600" text-anchor="middle">cell</text>
<line x1="175.1" y1="524" x2="208" y2="524" stroke="#e07b1a" stroke-width="3" stroke-linecap="round"/><circle cx="213" cy="524" r="6" fill="#e07b1a"/><line x1="298.6" y1="524" x2="250" y2="524" stroke="#4b525c" stroke-width="3" stroke-linecap="round"/><rect x="244" y="516" width="6" height="16" rx="2" fill="#4b525c"/><rect x="205" y="515" width="18" height="18" rx="5" fill="#d62728"/><line x1="180.0" y1="546" x2="208" y2="546" stroke="#e07b1a" stroke-width="3" stroke-linecap="round"/><circle cx="213" cy="546" r="6" fill="#e07b1a"/><line x1="292.0" y1="546" x2="250" y2="546" stroke="#4b525c" stroke-width="3" stroke-linecap="round"/><rect x="244" y="538" width="6" height="16" rx="2" fill="#4b525c"/><rect x="205" y="537" width="18" height="18" rx="5" fill="#d62728"/><line x1="175.1" y1="568" x2="208" y2="568" stroke="#e07b1a" stroke-width="3" stroke-linecap="round"/><circle cx="213" cy="568" r="6" fill="#e07b1a"/><line x1="298.6" y1="568" x2="250" y2="568" stroke="#4b525c" stroke-width="3" stroke-linecap="round"/><rect x="244" y="560" width="6" height="16" rx="2" fill="#4b525c"/><rect x="205" y="559" width="18" height="18" rx="5" fill="#d62728"/>
<text x="214" y="510" font-size="13" fill="#b71c1c" font-weight="700" text-anchor="middle">anti-PD-L1</text>
<circle cx="330" cy="546" r="40" fill="#ffffff" stroke="#4b525c" stroke-width="2"/><text x="330" y="543" font-size="14" fill="#222222" font-weight="700" text-anchor="middle">CD8+</text><text x="330" y="560" font-size="14" fill="#222222" font-weight="700" text-anchor="middle">T cell</text>
<path d="M300,576 Q240,624 176,582" fill="none" stroke="#4b525c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-ink)"/>
<text x="420" y="533" font-size="15" fill="#222222" font-weight="700" text-anchor="start">Brake blocked:</text><text x="420" y="553" font-size="14" fill="#4b525c" font-weight="400" text-anchor="start">the T cell attacks</text><text x="420" y="572" font-size="14" fill="#4b525c" font-weight="400" text-anchor="start">the tumour cell.</text></g>
</svg>
