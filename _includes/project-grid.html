{%- assign items = site.data.projects | where: "category", include.category -%}
<div class="grid{% if include.columns == 2 %} grid--2{% endif %}">
  {%- for p in items %}
  {%- if include.skip_featured and p.featured %}{% continue %}{% endif %}
  {% include project-card.html project=p lang=include.lang %}
  {%- endfor %}
</div>
